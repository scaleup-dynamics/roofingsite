    <meta property="og:type" content="website" />

    <!-- LocalBusiness / Roofing Contractor Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RoofingContractor",
      "name": "LuckyRoof Portland",
      "image": "https://images.pexels.com/photos/8491085/pexels-photo-8491085.jpeg",
      "telephone": "+1-555-123-4567",
      "email": "info@luckyroof.com",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Portland",
        "addressRegion": "OR",
        "postalCode": "97201",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 45.5152,
        "longitude": -122.6784
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "07:00",
          "closes": "19:00"
        }
      ],
      "areaServed": [
        "Portland",
        "Beaverton",
        "Hillsboro",
        "Lake Oswego",
        "Tigard",
        "Gresham",
        "Vancouver WA"
      ]
    }
    </script>

    <style>
      #root { min-height: 100vh; background: #07090b; }
    </style>
  </head>

    <div id="root"></div>
